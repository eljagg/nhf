{% extends "accounts/_shell.html" %}
{% block title %}Reset password{% endblock %}
{% block box %}
<h1 class="text-white text-2xl">Reset your password</h1>
<p class="text-sm text-white/80 mt-1 mb-6">Enter the e-mail address on your staff account. If it matches an account, we will send a link to set a new password.</p>
<form method="post" class="space-y-4">{% csrf_token %}
  <div><label class="glass-lbl" for="id_email">E-mail address</label><input class="glass-inp" id="id_email" type="email" name="email" autocomplete="email" required autofocus></div>
  <button class="glass-btn w-full">Send reset link</button>
</form>
<p class="mt-6"><a class="text-sm text-white/80" href="{% url 'accounts:login' %}">Back to sign in</a></p>
{% endblock %}
