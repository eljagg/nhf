{% extends "accounts/_shell.html" %}
{% block title %}Two-step sign-in{% endblock %}
{% block box %}
<h1 class="text-white text-2xl">Two-step sign-in</h1>
<p class="text-sm text-white/80 mt-2">Enter the six-digit code from your authenticator app.</p>
{% if error %}<div class="glass-msg glass-msg-error my-3" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="mt-4 flex gap-2">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><input class="glass-inp font-mono text-lg tracking-widest" name="token" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus aria-label="Six-digit code"><button class="glass-btn">Verify</button></form>
{% endblock %}
