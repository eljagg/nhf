{% if f %}<label class="flex items-start gap-2 text-sm"><span class="pt-0.5">{{ f }}</span><span>{{ label|default:f.label|capfirst }}{% if hint %} <span class="block text-xs text-slate-500">{{ hint }}</span>{% endif %}{% for e in f.errors %}<span class="block text-xs text-red-700">{{ e }}</span>{% endfor %}</span></label>{% endif %}
