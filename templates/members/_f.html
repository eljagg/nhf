{# One labelled form field: {% include "members/_f.html" with f=form.x span="md:col-span-2" hint="..." %} #}
{% if f %}<div class="{{ span }}"><label class="lbl" for="{{ f.id_for_label }}">{{ label|default:f.label|capfirst }}{% if opt %} <span class="font-normal text-slate-500">(optional)</span>{% endif %}</label>{{ f }}{% if hint %}<p class="text-xs text-slate-500 mt-1">{{ hint }}</p>{% endif %}{% for e in f.errors %}<p class="text-xs text-red-700 mt-1">{{ e }}</p>{% endfor %}</div>{% endif %}
