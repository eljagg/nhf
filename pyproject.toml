[tool.ruff]
line-length = 160
target-version = "py312"
exclude = ["**/migrations/**", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101", "S308", "B008", "DJ001", "DJ012", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"apps/*/management/*" = ["E501", "S311"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", "node_modules"]
skips = ["B101"]
