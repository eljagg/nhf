# Local development / single-host demonstration. NHF production layout (two app nodes, database replica) is in docs/deployment.md.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: nhf, POSTGRES_USER: nhf, POSTGRES_PASSWORD: nhf }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nhf"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build: .
    command: web
    env_file: .env
    environment:
      DATABASE_URL: postgres://nhf:nhf@db:5432/nhf
      REDIS_URL: redis://redis:6379/0
      SECURE_SSL_REDIRECT: "0"
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: .
    command: worker
    env_file: .env
    environment: { DATABASE_URL: "postgres://nhf:nhf@db:5432/nhf", REDIS_URL: "redis://redis:6379/0" }
    depends_on: [web]
  beat:
    build: .
    command: beat
    env_file: .env
    environment: { DATABASE_URL: "postgres://nhf:nhf@db:5432/nhf", REDIS_URL: "redis://redis:6379/0" }
    depends_on: [web]
volumes:
  pgdata:
